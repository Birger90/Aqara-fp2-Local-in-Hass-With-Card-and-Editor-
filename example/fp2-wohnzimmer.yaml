# Aqara FP2 mit ESPHome (hansihe/esphome_fp2) + Raumauswertung fp2_rooms
# Basis: example_config.yaml aus hansihe/esphome_fp2 (Board-, UART- und Pin-Angaben unverändert übernommen).
esphome:
  name: fp2-wohnzimmer
  friendly_name: FP2 Wohnzimmer
  on_boot:
    priority: -100
    then:
      # aqara_fp2 startet mit ausgeschalteter Positionsmeldung (fp2_component.cpp, perform_reset_).
      # fp2_rooms braucht sie -> nach der Radar-Initialisierung einschalten.
      - delay: 20s
      - switch.turn_on: fp2_report

esp32:
  board: esp32-solo1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: "y"
      CONFIG_ESP_SYSTEM_SINGLE_CORE_MODE: "y"
    advanced:
      ignore_efuse_mac_crc: true
      ignore_efuse_custom_mac: true
      # aqara_fp2_accel nutzt <driver/i2c.h>; ESPHome 2026.x schließt diese IDF-Komponenten standardmäßig aus
      include_builtin_idf_components: [driver, esp_driver_i2c]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "FP2 Wohnzimmer Fallback"
    password: !secret fallback_hotspot_password

captive_portal:

logger:

ota:
  - platform: esphome
    password: !secret ota_password

api:
  encryption:
    key: !secret api_encryption_key
  actions:
    # Für hansihes Original-Karte (optional)
    - action: get_map_config
      supports_response: only
      then:
        - api.respond:
            data: !lambda |-
              id(fp2).json_get_map_data(root);
    # --- Für fp2-room-card: Einmessung übertragen / lesen / löschen ---
    - action: set_layout
      variables:
        layout: string
      then:
        - lambda: |-
            std::string err;
            id(rooms).set_layout(layout.str(), err);
            id(layout_error) = err;
        - api.respond:
            data: !lambda |-
              root["ok"] = id(layout_error).empty();
              root["error"] = id(layout_error);
    - action: get_layout
      supports_response: only
      then:
        - api.respond:
            data: !lambda |-
              id(rooms).layout_json(root);
    - action: clear_layout
      then:
        - lambda: id(rooms).clear_layout();

globals:
  - id: layout_error
    type: std::string

uart:
  id: uart_bus
  tx_pin: GPIO19
  rx_pin: GPIO18
  baud_rate: 890000

external_components:
  - source:
      type: git
      url: https://github.com/hansihe/esphome_fp2
      ref: main
    components: [aqara_fp2, aqara_fp2_accel]
  - source:
      type: local
      path: ../components          # fp2_rooms

aqara_fp2_accel:
  id: fp2_accel

aqara_fp2:
  id: fp2
  accel: fp2_accel
  uart_id: uart_bus
  radar_reset_pin: GPIO13
  mounting_position: wall           # an deine Montage anpassen: wall | left_corner | right_corner
  left_right_reverse: false
  target_tracking:
    id: fp2_targets
    name: "Targets"
  location_report_switch:
    id: fp2_report
    name: "Report Targets"
  global_zone:
    presence_sensitivity: medium
    presence:
      name: "Radar Presence"
    # Pflicht: aqara_fp2 ruft bei jeder Bewegungsmeldung des Radars global_motion_sensor_->publish_state()
    # ohne Null-Prüfung auf (fp2_component.cpp, MOTION_DETECT) – ohne diesen Sensor stürzt der ESP ab.
    motion:
      name: "Radar Motion"
  radar_software_version:
    name: "Radar Software Version"
  mounting_position_sensor:
    name: "Mounting Position"        # für die Montage-Prüfung in der Karte

fp2_rooms:
  id: rooms
  targets: fp2_targets
  room:
