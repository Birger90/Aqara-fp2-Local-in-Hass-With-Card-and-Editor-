# Aqara FP2 mit ESPHome (hansihe/esphome_fp2) + Raumauswertung fp2_rooms
# Basis: example_config.yaml aus hansihe/esphome_fp2 (Board-, UART- und Pin-Angaben unverändert übernommen).
esphome:
  name: fp2-wohnzimmer
  friendly_name: FP2 Wohnzimmer
  on_boot:
    priority: -100
    then:
      # aqara_fp2 startet mit ausgeschalteter Positionsmeldung (fp2_component.cpp, perform_reset_).
      # fp2_rooms braucht sie -> nach der Radar-Initialisierung einschalten.
      - delay: 20s
      - switch.turn_on: fp2_report
      - script.execute: i2c_scan

# RGB-LED: am Gerät einzeln getestet (30.10.2026) – GPIO14 = rot, GPIO26 = grün, GPIO27 = blau, alle low-aktiv.
# (hansihe nutzt nur GPIO27 invertiert als Status-LED; hier stattdessen die ganze LED als dimmbares Licht.)
output:
  - platform: ledc
    id: led_r
    pin: GPIO14
    inverted: true
  - platform: ledc
    id: led_g
    pin: GPIO26
    inverted: true
  - platform: ledc
    id: led_b
    pin: GPIO27
    inverted: true

light:
  - platform: rgb
    name: "LED"
    red: led_r
    green: led_g
    blue: led_b
    restore_mode: ALWAYS_OFF

# Suche nach dem Lichtsensor: Scan des I2C-Busses (Port 0, SDA IO33 / SCL IO32), den aqara_fp2_accel
# eingerichtet hat (0x27 = Beschleunigungssensor). Kein eigener i2c:-Block, der würde mit dem Treiber kollidieren.
script:
  - id: i2c_scan
    then:
      - lambda: |-
          int found = 0;
          for (uint8_t a = 0x08; a < 0x78; a++) {
            i2c_cmd_handle_t cmd = i2c_cmd_link_create();
            i2c_master_start(cmd);
            i2c_master_write_byte(cmd, (a << 1) | I2C_MASTER_WRITE, true);
            i2c_master_stop(cmd);
            esp_err_t r = i2c_master_cmd_begin(I2C_NUM_0, cmd, pdMS_TO_TICKS(20));
            i2c_cmd_link_delete(cmd);
            if (r == ESP_OK) { ESP_LOGI("i2c_scan", "Antwort von Adresse 0x%02X", a); found++; }
            else if (r == ESP_ERR_INVALID_STATE) { ESP_LOGW("i2c_scan", "I2C-Port 0 nicht initialisiert"); break; }
          }
          ESP_LOGI("i2c_scan", "%d Geraet(e) gefunden", found);
          // Kennung des Chips auf 0x44 lesen (16-Bit-Register, MSB zuerst): 0x7E Hersteller, 0x7F Geraet, 0x00/0x01 Daten/Konfig
          for (uint8_t reg : {0x7E, 0x7F, 0x00, 0x01}) {
            uint8_t v[2] = {0, 0};
            esp_err_t r = i2c_master_write_read_device(I2C_NUM_0, 0x44, &reg, 1, v, 2, pdMS_TO_TICKS(50));
            ESP_LOGI("i2c_scan", "0x44 Reg 0x%02X: %s 0x%02X%02X", reg, r == ESP_OK ? "ok" : esp_err_to_name(r), v[0], v[1]);
          }
          gpio_set_direction(GPIO_NUM_35, GPIO_MODE_INPUT);
          ESP_LOGI("i2c_scan", "GPIO35 Pegel: %d", gpio_get_level(GPIO_NUM_35));

# Lichtsensor: TI OPT3001 auf 0x44 (per Scan gefunden; Hersteller-ID 0x5449, Geräte-ID 0x3001 ausgelesen).
# Direkt über den I2C-Treiber von aqara_fp2_accel, weil ein eigener i2c:-Block mit ihm kollidieren würde.
# Konfiguration 0xCC10 = automatischer Bereich, 800 ms Wandlung, Dauerbetrieb. Lux = 0,01 · 2^E · M (Datenblatt).
sensor:
  - platform: template
    name: "Helligkeit"
    unit_of_measurement: lx
    device_class: illuminance
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      uint8_t reg = 0x01, v[2] = {0, 0};
      if (i2c_master_write_read_device(I2C_NUM_0, 0x44, &reg, 1, v, 2, pdMS_TO_TICKS(50)) != ESP_OK) return NAN;
      if ((v[0] & 0x06) != 0x04) {   // nicht im Dauerbetrieb (z. B. nach Neustart): einschalten
        const uint8_t cfg[3] = {0x01, 0xCC, 0x10};
        i2c_master_write_to_device(I2C_NUM_0, 0x44, cfg, 3, pdMS_TO_TICKS(50));
        return NAN;
      }
      reg = 0x00;
      if (i2c_master_write_read_device(I2C_NUM_0, 0x44, &reg, 1, v, 2, pdMS_TO_TICKS(50)) != ESP_OK) return NAN;
      const uint16_t raw = (v[0] << 8) | v[1];
      return 0.01f * (1 << (raw >> 12)) * (raw & 0x0FFF);

button:
  - platform: template
    name: "I2C Scan"
    entity_category: diagnostic
    on_press:
      - script.execute: i2c_scan

esp32:
  board: esp32-solo1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: "y"
      CONFIG_ESP_SYSTEM_SINGLE_CORE_MODE: "y"
    advanced:
      ignore_efuse_mac_crc: true
      ignore_efuse_custom_mac: true
      # aqara_fp2_accel nutzt <driver/i2c.h>; ESPHome 2026.x schließt diese IDF-Komponenten standardmäßig aus
      include_builtin_idf_components: [driver, esp_driver_i2c]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "FP2 Wohnzimmer Fallback"
    password: !secret fallback_hotspot_password

captive_portal:

logger:

ota:
  - platform: esphome
    password: !secret ota_password

api:
  encryption:
    key: !secret api_encryption_key
  actions:
    # Für hansihes Original-Karte (optional)
    - action: get_map_config
      supports_response: only
      then:
        - api.respond:
            data: !lambda |-
              id(fp2).json_get_map_data(root);
    # --- Für fp2-room-card: Einmessung übertragen / lesen / löschen ---
    - action: set_layout
      variables:
        layout: string
      then:
        - lambda: |-
            std::string err;
            id(rooms).set_layout(layout.str(), err);
            id(layout_error) = err;
        - api.respond:
            data: !lambda |-
              root["ok"] = id(layout_error).empty();
              root["error"] = id(layout_error);
    - action: get_layout
      supports_response: only
      then:
        - api.respond:
            data: !lambda |-
              id(rooms).layout_json(root);
    - action: clear_layout
      then:
        - lambda: id(rooms).clear_layout();

globals:
  - id: layout_error
    type: std::string

uart:
  id: uart_bus
  tx_pin: GPIO19
  rx_pin: GPIO18
  baud_rate: 890000

external_components:
  - source:
      type: git
      url: https://github.com/hansihe/esphome_fp2
      ref: main
    components: [aqara_fp2, aqara_fp2_accel]
  - source:
      type: local
      path: ../components          # fp2_rooms

aqara_fp2_accel:
  id: fp2_accel

aqara_fp2:
  id: fp2
  accel: fp2_accel
  uart_id: uart_bus
  radar_reset_pin: GPIO13
  mounting_position: wall           # an deine Montage anpassen: wall | left_corner | right_corner
  left_right_reverse: false
  target_tracking:
    id: fp2_targets
    name: "Targets"
  location_report_switch:
    id: fp2_report
    name: "Report Targets"
  global_zone:
    presence_sensitivity: medium
    presence:
      name: "Radar Presence"
    # Pflicht: aqara_fp2 ruft bei jeder Bewegungsmeldung des Radars global_motion_sensor_->publish_state()
    # ohne Null-Prüfung auf (fp2_component.cpp, MOTION_DETECT) – ohne diesen Sensor stürzt der ESP ab.
    motion:
      name: "Radar Motion"
  radar_software_version:
    name: "Radar Software Version"
  mounting_position_sensor:
    name: "Mounting Position"        # für die Montage-Prüfung in der Karte

fp2_rooms:
  id: rooms
  targets: fp2_targets
